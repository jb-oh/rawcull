name: RawCull
options:
  bundleIdPrefix: works.favren
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ko, Base]
packages:
  FavrenUI:
    path: ../favren-works/brand/apple/FavrenUI
targets:
  RawCull:
    type: application
    platform: macOS
    sources:
      - path: Sources/RawCull
      # type: folder.iconcomposer.icon makes XcodeGen emit lastKnownFileType = wrapper.icon in
      # RawCull.xcodeproj/project.pbxproj, which actool accepts to build Assets.car + AppIcon.icns
      # from the .icon folder. If a future `xcodegen generate` writes plain "folder" instead, the
      # icon will not compile; fix the reference back to wrapper.icon.
      - path: AppIcon.icon
        buildPhase: resources
        type: folder.iconcomposer.icon
    dependencies:
      - package: FavrenUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.favren.rawcull
        PRODUCT_NAME: RawCull
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RawCull
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # scripts/package.sh signs Release with Developer ID and notarizes it, which requires
        # the hardened runtime. The team ID comes from ~/.config/favren/asc.env at build time.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
