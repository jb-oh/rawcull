name: RawCull
options:
  bundleIdPrefix: works.favren
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  FavrenUI:
    path: ../favren-works/brand/apple/FavrenUI
targets:
  RawCull:
    type: application
    platform: macOS
    sources:
      - path: Sources/RawCull
      # type: folder.iconcomposer.icon so actool builds Assets.car + AppIcon.icns from the .icon folder.
      # If a future `xcodegen generate` writes lastKnownFileType as plain "folder" in RawCull.xcodeproj,
      # hand-fix that reference back to folder.iconcomposer.icon.
      - path: AppIcon.icon
        buildPhase: resources
        type: folder.iconcomposer.icon
    dependencies:
      - package: FavrenUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.favren.rawcull
        PRODUCT_NAME: RawCull
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RawCull
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
